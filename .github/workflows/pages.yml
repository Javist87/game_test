name: Publiser til GitHub Pages

# Legger spillet og wikien ut på nett ved hver push til main.
#
# FØRSTE GANG må Pages slås på for hånd — det er ett klikk:
#
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Uten det feiler jobben med «Not Found» fra Pages-API-et. enablement: true
# under prøver å slå det på selv, men GITHUB_TOKEN har ikke lov til å
# opprette et Pages-nettsted («Resource not accessible by integration») —
# det krever administrasjonsrettigheter en workflow ikke får. Flagget står
# igjen fordi det virker i repoer der tokenet faktisk har rettighetene.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Én utrulling om gangen. Kjørende jobber får fullføre.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Ingen npm install — prosjektet har ingen avhengigheter. Skriptet
      # bygger dist/ og sjekker selv at ingenting mangler, så oppsettet er
      # det samme lokalt som her. Vi laster ikke opp hele repoet: .git og
      # verktøykoden har ingenting på en nettside å gjøre.
      - name: Bygg nettstedet
        run: node tools/bygg-nettsted.mjs

      # Best forsøk på å slå på Pages selv. Lykkes ikke det, må noen innom
      # Settings → Pages → Source: GitHub Actions én gang. Se toppen av fila.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiser:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.utrulling.outputs.page_url }}
    steps:
      - id: utrulling
        uses: actions/deploy-pages@v4
